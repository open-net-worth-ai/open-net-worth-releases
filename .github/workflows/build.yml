name: Build desktop apps

# Builds the Linux and Windows desktop apps from the PRIVATE source repo and publishes the
# installers to this repo's release. Runs here because Actions are free on public repos.
# The source is checked out read-only onto the throwaway runner and never committed, uploaded
# or printed; only the finished installers leave the runner. Manual trigger only, so secrets
# are never exposed to pull requests. macOS is built and notarized on the maintainer's Mac.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match desktop/package.json at the chosen refs)
        required: true
        default: 0.1.0
      platforms:
        description: Which platforms to build
        type: choice
        options: [both, linux, windows]
        default: both
      linux_ref:
        description: Source ref for the Linux build
        default: main
      windows_ref:
        description: Source ref for the Windows build
        default: main
      publish:
        description: Upload the installers to release v<version>
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  linux:
    if: inputs.platforms != 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: open-net-worth-ai/open-net-worth
          ref: ${{ inputs.linux_ref }}
          token: ${{ secrets.ONW_SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Version matches
        working-directory: src
        run: test "$(node -p 'require("./desktop/package.json").version')" = "${{ inputs.version }}"
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb fakeroot dpkg libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libatspi2.0-0t64 libsecret-1-0 libnotify4 >/dev/null
      - name: Desktop unit tests
        working-directory: src/desktop
        run: |
          export ONW_DESKTOP_PYTHON="$(command -v python3)"
          npm ci --silent
          npm run typecheck --silent
          npm test --silent 2>&1 | tail -8
      - name: Build relocatable runtime
        working-directory: src
        run: python3 scripts/build_desktop_runtime.py >/dev/null
      - name: Package AppImage and .deb
        working-directory: src/desktop
        run: npm run make --silent >/dev/null
      - name: Smoke the packaged AppImage
        working-directory: src/desktop
        run: xvfb-run -a node qa/packaged-smoke-linux.mjs "$(realpath "$(find out/make -name '*.AppImage' | head -1)")"
      - name: Install the .deb and smoke it with its sandbox
        working-directory: src/desktop
        run: |
          sudo apt-get install -y -qq "$(realpath "$(find out/make -name '*.deb' | head -1)")" >/dev/null
          test "$(stat -c %a /usr/lib/open-net-worth/chrome-sandbox)" = 4755
          xvfb-run -a node qa/packaged-smoke-linux.mjs /usr/lib/open-net-worth/open-net-worth
      - name: Stage release files
        run: |
          mkdir -p release
          cp "$(find src/desktop/out/make -name '*.AppImage' | head -1)" release/Open-Net-Worth-linux-x86_64.AppImage
          cp "$(find src/desktop/out/make -name '*.deb' | head -1)" release/Open-Net-Worth-linux-amd64.deb
          cp src/scripts/install-desktop.sh release/install.sh
          ls -la release
      - name: Terminal installer installs the staged AppImage
        run: |
          mkdir -p "$RUNNER_TEMP/served" && cp release/* "$RUNNER_TEMP/served/"
          (cd "$RUNNER_TEMP/served" && sha256sum -- * > SHA256SUMS)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/served" >/dev/null 2>&1 &
          sleep 1
          export HOME="$RUNNER_TEMP/installer-home" ONW_RELEASE_BASE_URL=http://127.0.0.1:8765
          mkdir -p "$HOME"
          sh release/install.sh
          test -x "$HOME/.local/bin/open-net-worth"
          sh release/install.sh --uninstall
          test ! -e "$HOME/.local/bin/open-net-worth"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/
          retention-days: 3
          if-no-files-found: error

  windows:
    if: inputs.platforms != 'linux'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: open-net-worth-ai/open-net-worth
          ref: ${{ inputs.windows_ref }}
          token: ${{ secrets.ONW_SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Version matches
        working-directory: src
        run: test "$(node -p 'require("./desktop/package.json").version')" = "${{ inputs.version }}"
      - name: Desktop unit tests
        working-directory: src
        run: |
          python -m pip install -q -r requirements.txt
          export ONW_DESKTOP_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cd desktop
          npm ci --silent
          npm run typecheck --silent
          npm test --silent 2>&1 | tail -8
      - name: Installer script tests (Pester)
        working-directory: src
        shell: pwsh
        run: Invoke-Pester -Path scripts/install.Tests.ps1 -CI
      - name: Build relocatable runtime
        working-directory: src
        run: python scripts/build_desktop_runtime.py >/dev/null
      - name: Package application and installer
        working-directory: src/desktop
        run: npm run make --silent >/dev/null
      - name: Install with install.ps1 and smoke the installed app
        working-directory: src
        shell: pwsh
        env:
          ONW_DESKTOP_UPDATES: '0'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'onw-setup'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item (Get-ChildItem desktop/out/make -Recurse -Filter 'Open-Net-Worth-windows-x64-setup.exe').FullName $dir
          $hash = (Get-FileHash (Join-Path $dir 'Open-Net-Worth-windows-x64-setup.exe') -Algorithm SHA256).Hash.ToLower()
          "$hash  Open-Net-Worth-windows-x64-setup.exe" | Set-Content (Join-Path $dir 'SHA256SUMS')
          ./scripts/install.ps1 -SourceDirectory $dir -AllowUnsigned
          Start-Sleep -Seconds 10
          Get-Process open-net-worth -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          $exe = (Get-ChildItem "$env:LOCALAPPDATA\OpenNetWorth" -Recurse -Filter open-net-worth.exe | Select-Object -First 1).FullName
          Push-Location desktop
          node qa/packaged-smoke.mjs $exe
          Pop-Location
      - name: Stage release files
        shell: pwsh
        run: |
          $make = (Get-ChildItem src/desktop/out/make/squirrel.windows -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item (Join-Path $make 'Open-Net-Worth-windows-x64-setup.exe') release
          Copy-Item (Join-Path $make 'RELEASES') release
          Copy-Item (Get-ChildItem $make -Filter *-full.nupkg).FullName release
          Copy-Item src/scripts/install.ps1 release
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
          retention-days: 3
          if-no-files-found: error

  publish:
    if: inputs.publish && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/
          merge-multiple: true
      - name: Publish to v${{ inputs.version }} with one merged SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          ls -la release
          gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1 || { echo "::error::release v$VERSION does not exist (macOS creates it)"; exit 1; }
          work="$(mktemp -d)"
          gh release download "v$VERSION" --repo "$REPO" --pattern SHA256SUMS --dir "$work" || : > "$work/SHA256SUMS"
          for f in release/*; do
            name="$(basename "$f")"
            grep -v "  $name\$" "$work/SHA256SUMS" > "$work/next" || true
            (cd release && sha256sum "$name") >> "$work/next"
            mv "$work/next" "$work/SHA256SUMS"
          done
          cp "$work/SHA256SUMS" release/SHA256SUMS
          cat release/SHA256SUMS
          gh release upload "v$VERSION" release/* --repo "$REPO" --clobber
