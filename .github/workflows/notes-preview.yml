name: Preview release notes

# Rebuilds a published release's notes - Claude's Highlights on top of the grouped commit list -
# and the Discord post the `announce` job would send, from the same commit range and the source's
# scripts at `ref`. Everything goes to the run summary; nothing is published, and nothing is
# posted unless `post` is on. Use it to check a change to the notes or the announcement before
# the nightly does it for real.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to preview (blank = the latest release)
        default: ''
      ref:
        description: Source ref whose scripts/release_notes.py and release_announce.py to use
        default: main
      post:
        description: Also send the post to the Discord channel
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_REPO: open-net-worth-ai/open-net-worth

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TOKEN: ${{ secrets.ONW_SOURCE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REPO: ${{ github.repository }}
      VERSION_IN: ${{ inputs.version }}
      REF: ${{ inputs.ref || 'main' }}
      POST: ${{ inputs.post && 'true' || 'false' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'anthropic==1.14.0'
      - name: Rebuild the notes and the post
        env:
          DISCORD_WEBHOOK_URL: ${{ inputs.post && secrets.DISCORD_RELEASE_WEBHOOK || '' }}
        run: |
          set -euo pipefail
          source_of() { gh release view "v$1" --repo "$REPO" --json body --jq .body | grep -oE 'Source: [0-9a-f]{40}' | cut -c9- | tail -1 || true; }
          versions="$(gh release list --repo "$REPO" --limit 200 --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V)"
          version="${VERSION_IN:-$(echo "$versions" | tail -1)}"
          prev="$(echo "$versions" | awk -v v="$version" '$0 == v { print last; exit } { last = $0 }')"
          [ -n "$prev" ] || { echo "::error::no release before $version"; exit 1; }
          sha="$(source_of "$version")"; prev_sha="$(source_of "$prev")"
          [ -n "$sha" ] && [ -n "$prev_sha" ] || { echo "::error::v$version or v$prev has no Source line"; exit 1; }
          echo "v$version: source $prev_sha..$sha (previous release v$prev); scripts from $REF"

          for f in release_notes release_announce; do
            GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO/contents/scripts/$f.py?ref=$REF" --jq .content | base64 -d > "$RUNNER_TEMP/$f.py"
          done
          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO/compare/$prev_sha...$sha" \
            --jq '[.commits[].commit.message | split("\n")[0]] | reverse | .[]' > "$RUNNER_TEMP/subjects.txt"
          python3 "$RUNNER_TEMP/release_notes.py" --highlights < "$RUNNER_TEMP/subjects.txt" > "$RUNNER_TEMP/notes.md"

          url="https://github.com/$REPO/releases/tag/v$version"
          flags=(--version "$version" --release-url "$url")
          [ "$POST" = true ] || flags+=(--dry-run)
          python3 "$RUNNER_TEMP/release_announce.py" "${flags[@]}" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/announce.out"

          {
            echo "# v$version release notes (preview)"
            echo
            echo "$(wc -l < "$RUNNER_TEMP/subjects.txt") commits since v$prev. Scripts from \`$REF\`."
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            if [ "$POST" = true ]; then echo "## Discord: posted"; else echo "## Discord payload (not sent)"; fi
            echo
            echo '```json'
            cat "$RUNNER_TEMP/announce.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/announce.out"
